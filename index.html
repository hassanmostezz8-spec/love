<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>بحبك ❤️</title>
<style>
    body {
        background: #ffdde1;
        font-family: Arial;
        text-align: center;
        overflow: hidden;
        margin: 0;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        flex-direction: column;
    }
    .card {
        background: white;
        padding: 40px;
        border-radius: 25px;
        box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        z-index: 2;
    }
    h1 {
        color: #ff2e63;
        font-size: 45px;
        margin: 10px;
    }
    p {
        font-size: 20px;
        color: #555;
    }
    button {
        background: #ff2e63;
        color: white;
        border: none;
        padding: 15px 30px;
        font-size: 20px;
        border-radius: 50px;
        cursor: pointer;
    }
    button:hover {
        background: #d61f4d;
        transform: scale(1.1);
    }
    #msg {
        display: none;
        margin-top: 20px;
        font-size: 24px;
        color: #ff2e63;
        font-weight: bold;
    }
    .heart {
        position: absolute;
        font-size: 30px;
        animation: fly 4s linear infinite;
        opacity: 0.7;
    }
    @keyframes fly {
        0% { transform: translateY(100vh) rotate(0deg); }
        100% { transform: translateY(-100px) rotate(360deg); }
    }
</style>
</head>
<body>

<div class="card">
    <div style="font-size:70px;">❤️</div>
    <h1>بحبك أوي</h1>
    <p>الموقع ده اتعمل ليكي انتي بس</p>
    <button onclick="showLove()">دوسي هنا</button>
    <div id="msg">انتي أحلى حاجة حصلتلي في حياتي ❤️❤️</div>
</div>

<script>
    function showLove() {
        document.getElementById('msg').style.display = 'block';
    }
    // قلوب طايرة
    for(let i=0; i<20; i++){
        let h = document.createElement('div');
        h.className = 'heart';
        h.innerHTML = '❤️';
        h.style.left = Math.random()*100 + 'vw';
        h.style.animationDelay = Math.random()*4 + 's';
        document.body.appendChild(h);
    }
</script>
